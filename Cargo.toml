[package]
name = "crup"
version = "0.1.0"
edition = "2021"
description = "CRusty Url Parser - Rust backend for Python URL parsing"
license = "MIT"
repository = "https://github.com/inueni/crup"

[lib]
name = "crup"
crate-type = ["cdylib"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[dependencies]
once_cell = "1.21.4"
publicsuffix = "2.3.0"
pyo3 = { version = "0.29.3", features = ["extension-module"] }
url = "2.5.8"
ureq = "3.4.2"
directories = "6.0.0"
tempfile = "3.27.0"

[build-dependencies]
pyo3-build-config = "0.29.3"
