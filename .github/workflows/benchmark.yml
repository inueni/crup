name: Benchmark

on:
  workflow_dispatch:
    inputs:
      baseline-ref:
        description: Optional baseline branch, tag or commit to compare
        required: false
        type: string

permissions:
  contents: read

jobs:
  benchmark:
    name: Benchmark (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            architecture: x64
          - os: ubuntu-26.04-arm
            architecture: arm64
          - os: windows-2025
            architecture: x64
          - os: macos-26
            architecture: arm64
          - os: macos-26-intel
            architecture: x64
    defaults:
      run:
        shell: bash
    env:
      BASELINE_REF: ${{ inputs.baseline-ref }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/benchmark-target
      RUSTUP_TOOLCHAIN: stable
      PYTHONUTF8: "1"
    steps:
      - name: Check out benchmark harness
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          path: harness
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          architecture: ${{ matrix.architecture }}
      - name: Install build tools
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          python -m pip install "maturin==1.15.0" can_ada
      - name: Check out baseline
        if: ${{ inputs.baseline-ref != '' }}
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.baseline-ref }}
          path: source
      - name: Build baseline wheel
        if: ${{ inputs.baseline-ref != '' }}
        working-directory: source
        run: |
          echo "BASELINE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python -m maturin build --release --locked --interpreter python --out ../wheels/baseline
      - name: Check out candidate
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          path: source
      - name: Build candidate wheel
        working-directory: source
        run: |
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python -m maturin build --release --locked --interpreter python --out ../wheels/candidate
      - name: Inspect wheels
        run: |
          python harness/scripts/check_dist.py wheels/candidate/*.whl --psl-metadata harness/python/crup/psl_snapshot.json

          if [[ -n "$BASELINE_REF" ]]; then
            python harness/scripts/check_dist.py wheels/baseline/*.whl
          fi
      - name: Measure installed wheels
        run: |
          baseline_args=()

          if [[ -n "$BASELINE_REF" ]]; then
            baseline_args=(--baseline wheels/baseline/*.whl --baseline-sha "$BASELINE_SHA")
          fi

          python harness/benchmark/ci.py \
            --candidate wheels/candidate/*.whl --candidate-sha "$CANDIDATE_SHA" \
            --psl harness/python/crup/public_suffix_list.dat \
            --output results/benchmark.json "${baseline_args[@]}"
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: benchmark-${{ matrix.os }}
          path: results/
