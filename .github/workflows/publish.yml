# Wheel jobs are based on `maturin generate-ci github`.
# Release gates and dependency versions are maintained manually.
name: Publish

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/CI.yml

  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-26.04
            target: x86_64
          - runner: ubuntu-24.04
            target: x86
          - runner: ubuntu-26.04-arm
            target: aarch64
          - runner: ubuntu-26.04
            target: armv7
          - runner: ubuntu-26.04
            target: s390x
          - runner: ubuntu-26.04
            target: ppc64le
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - name: Build wheels
        uses: PyO3/maturin-action@v1.51.0
        with:
          maturin-version: "1.15.0"
          target: ${{ matrix.platform.target }}
          args: --locked --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: ${{ matrix.platform.target == 'x86' && '2_28' || 'auto' }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-26.04
            target: x86_64
          - runner: ubuntu-26.04
            target: x86
          - runner: ubuntu-26.04
            target: aarch64
          - runner: ubuntu-26.04
            target: armv7
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - name: Build wheels
        uses: PyO3/maturin-action@v1.51.0
        with:
          maturin-version: "1.15.0"
          target: ${{ matrix.platform.target }}
          args: --locked --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        platform:
          - runner: windows-latest
            target: x64
          - runner: windows-latest
            target: x86
        include:
          - platform:
              runner: windows-latest
              target: x64
            python-version: "3.14t"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1.51.0
        with:
          maturin-version: "1.15.0"
          target: ${{ matrix.platform.target }}
          args: --locked --release --out dist --interpreter python
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wheels-windows-${{ matrix.platform.target }}-${{ matrix.python-version }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-26-intel
            target: x86_64
          - runner: macos-26
            target: aarch64
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.14
            3.14t
      - name: Build wheels
        uses: PyO3/maturin-action@v1.51.0
        with:
          maturin-version: "1.15.0"
          target: ${{ matrix.platform.target }}
          args: --locked --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    environment: pypi
    needs: [ci, linux, musllinux, windows, macos]
    permissions:
      # Used for artifact attestation and Trusted Publishing
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: wheels-*
      - name: Inspect release artifacts
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        shell: bash
        run: |
          python scripts/check_dist.py wheels-*/* --psl-metadata python/crup/psl_snapshot.json ${RELEASE_TAG:+--tag "$RELEASE_TAG"}
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: 'wheels-*/*'
      - name: Publish to PyPI
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        uses: PyO3/maturin-action@v1.51.0
        with:
          maturin-version: "1.15.0"
          command: upload
          args: --non-interactive --skip-existing wheels-*/*
